<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <title>Super Verticale</title>
  <script src="/js/site-config.js"></script>
  <link rel="stylesheet" href="/css/mystery.css">
</head>
<body>
  <main class="mystery-page">
    <header class="mystery-header">
      <img class="brand-logo" src="/assets/logos/SuperVerticale.svg" alt="Super Verticale">
      <span class="header-index">PETZEN / AUSTRIA</span>
    </header>

    <section class="mystery-content" aria-labelledby="mystery-title">
      <p class="eyebrow">PETZEN / AUSTRIA <span>·</span> 21.08.2027</p>
      <h1 id="mystery-title">A DIFFERENT KIND<br>OF TRAIL RUN.</h1>
      <form class="signup-form" novalidate>
        <label class="visually-hidden" for="signup-email">Email address</label>
        <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="YOUR EMAIL ADDRESS" required>
        <button type="submit">GET FIRST ACCESS <span aria-hidden="true">→</span></button>
      </form>
      <p class="signup-status" role="status" aria-live="polite"></p>
    </section>

    <footer class="mystery-footer">
      <span>SUPERVERTICALE.COM</span>
      <span>21 AUGUST 2027</span>
    </footer>
  </main>
  <script src="/js/mystery.js" defer></script>
</body>
</html>

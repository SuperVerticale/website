<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#603834" />
    <title>Petzen Super Verticale | Events</title>
    <link rel="icon" href="assets/logos/sv_mini.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'TT Chocolates';
        src: url('assets/fonts/tt-chocolates-regular.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --brown: #292017;
        --rust: #603834;
        --neon: #e0f131;
        --green: #937c66;
        --muted: #a99886;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--rust);
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--rust);
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
      }

      .topbar,
      main {
        width: min(100% - 2rem, 1180px);
        margin: 0 auto;
      }

      .topbar {
        position: relative;
        position: fixed;
        top: 0;
        left: 50%;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2rem 0 1.25rem;
        background: var(--rust);
        transform: translateX(-50%);
      }

      main {
        padding-top: 2rem;
      }

      .gate {
        display: grid;
        min-height: calc(100vh - 5rem);
        place-items: center;
      }

      .gate.is-hidden {
        display: none;
      }

      .login-panel {
        width: min(100%, 24rem);
        padding: 2rem;
        border: 1px solid var(--green);
        background: var(--rust);
      }

      .login-panel h2 {
        margin: 0 0 0.5rem;
        color: var(--neon);
        font-size: clamp(1.5rem, 5vw, 2.25rem);
      }

      .login-intro {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .login-panel label {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .password-row {
        display: flex;
        gap: 0.5rem;
      }

      .password-row input,
      .password-row button {
        min-height: 2.75rem;
        border: 1px solid var(--green);
        border-radius: 0;
        font: inherit;
      }

      .password-row input {
        min-width: 0;
        flex: 1;
        padding: 0 0.75rem;
        background: var(--rust);
        color: var(--neon);
      }

      .password-row button {
        padding: 0 1rem;
        background: var(--neon);
        color: var(--brown);
        cursor: pointer;
        font-weight: 700;
      }

      .login-status {
        min-height: 1.25rem;
        margin: 0.75rem 0 0;
        color: #e85d3f;
        font-size: 0.8rem;
      }

      .page-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(44vw, 14.3rem);
        height: auto;
        transform: translate(-50%, -50%);
      }

      .topbar a {
        color: var(--neon);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .back-link {
        color: var(--muted) !important;
      }

      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        padding: 0.75rem 0 0;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: none;
        margin: 0;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: clamp(1.9rem, 7vw, 5.8rem);
        font-weight: 400;
        line-height: 0.92;
        white-space: nowrap;
      }

      .stats {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
      }

    .stat {
        position: relative;
      padding: 1rem 1.25rem;
      text-align: center;
    }

    .stat:not(:last-child)::after {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
      height: 2.75rem;
      background: var(--muted);
      opacity: 0.55;
    }

      .stat-value {
        color: var(--neon);
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 700;
      }

      .stat-label {
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .visuals {
        display: block;
        padding: 0rem 0 3rem;
      }

      figure {
        margin: 0;
        padding: 0;
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
        background: var(--brown);
      }

      .interactive-route {
        display: block;
        width: 100%;
        height: min(68vw, 57rem);
        min-height: 32rem;
        border: 0;
        background: var(--rust);
      }

      @media (max-width: 720px) {
        .hero {
          display: block;
        }

        .stats {
          grid-template-columns: repeat(3, 1fr);
        }

        .stat,
        .stat + .stat {
          padding-right: 0.5rem;
          padding-left: 0.5rem;
        }

      }

      @media (max-width: 420px) {
        .topbar,
        main {
          width: min(100% - 1.25rem, 1180px);
        }

        .stat,
        .stat + .stat {
          padding-right: 0.6rem;
          padding-left: 0;
        }

        .stat:nth-child(even) {
          padding-left: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" aria-label="Zur Startseite">
        <img class="page-logo" src="assets/logos/SuperVerticale.svg" alt="Super Verticale" />
      </a>
      <a class="back-link" href="index.html">Back</a>
    </header>

    <main>
      <section class="gate" id="gate">
        <form class="login-panel" id="login-form">
          <h2>Private Event</h2>
          <p class="login-intro">Geschützter Bereich für die Event-Route.</p>
          <label for="password">Passwort</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">Öffnen</button>
          </div>
          <p class="login-status" id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

    </main>

    <main id="event-content" hidden>
      <section class="hero" aria-labelledby="event-title">
        <div>
          <p class="eyebrow">SUPER VERTICALE / Bleiburg, Carinthia, Austria</p>
          <h1 id="event-title">PETZEN 2027</h1>
        </div>
      </section>
      <section class="stats" aria-label="Event statistics">
        <div class="stat"><div class="stat-value">10,1 km</div><div class="stat-label">Distance</div></div>
        <div class="stat"><div class="stat-value">+1.074 m</div><div class="stat-label">Elevation gain</div></div>
        <div class="stat"><div class="stat-value">10,6 %</div><div class="stat-label">Average slope</div></div>
      </section>
      <section class="visuals" aria-label="Event route and elevation profile">
        <figure>
          <iframe class="interactive-route" src="assets/route/PetzensuperVerticale-interactive.html" title="Interactive GPS route and elevation profile of the Petzen Super Verticale"></iframe>
        </figure>
      </section>
    </main>

    <script>
      const passwordHash = 'c7f696b2751c1bbe935f635ff41a16093996544796b30089446717509807af12';
      const form = document.querySelector('#login-form');
      const passwordInput = document.querySelector('#password');
      const status = document.querySelector('#status');
      const gate = document.querySelector('#gate');
      const eventContent = document.querySelector('#event-content');

      async function sha256(value) {
        const encoded = new TextEncoder().encode(value);
        const buffer = await crypto.subtle.digest('SHA-256', encoded);
        return Array.from(new Uint8Array(buffer), (byte) => byte.toString(16).padStart(2, '0')).join('');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = '';

        try {
          if (await sha256(passwordInput.value) !== passwordHash) {
            status.textContent = 'Passwort nicht erkannt.';
            passwordInput.select();
            return;
          }

          gate.classList.add('is-hidden');
          gate.setAttribute('aria-hidden', 'true');
          eventContent.hidden = false;
        } catch (error) {
          status.textContent = 'Passwortprüfung konnte nicht ausgeführt werden.';
        }
      });
    </script>

  </body>
</html>

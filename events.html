<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#603834" />
    <title>Petzen Super Verticale | Events</title>
    <link rel="icon" href="assets/logos/sv_mini.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'TT Chocolates';
        src: url('assets/fonts/tt-chocolates-regular.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --brown: #292017;
        --rust: #603834;
        --neon: #e0f131;
        --green: #937c66;
        --muted: #a99886;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--rust);
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--rust);
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
      }

      .topbar,
      main {
        width: min(100% - 2rem, 1180px);
        margin: 0 auto;
      }

      .topbar {
        position: relative;
        position: fixed;
        top: 0;
        left: 50%;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2rem 0 1.25rem;
        background: var(--rust);
        transform: translateX(-50%);
      }

      main {
        padding-top: 3.5rem;
      }

      .page-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(44vw, 14.3rem);
        height: auto;
        transform: translate(-50%, -50%);
      }

      .topbar a {
        color: var(--neon);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .back-link {
        color: var(--muted) !important;
      }

      .hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        padding: 2rem 0;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: none;
        margin: 0;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: clamp(1.9rem, 7vw, 5.8rem);
        font-weight: 400;
        line-height: 0.92;
        white-space: nowrap;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }

      .stat {
        padding: 1rem 1.25rem 1rem 0;
      }

      .stat + .stat {
        padding-left: 1.25rem;
      }

      .stat-value {
        color: var(--neon);
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 700;
      }

      .stat-label {
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .visuals {
        display: block;
        padding: 2rem 0 3rem;
      }

      figure {
        margin: 0;
        padding: 0;
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
        background: var(--brown);
      }

      .interactive-route {
        display: block;
        width: 100%;
        height: min(68vw, 57rem);
        min-height: 32rem;
        border: 0;
        background: var(--rust);
      }

      @media (max-width: 720px) {
        .hero {
          display: block;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .stat:nth-child(3) {
          padding-left: 0;
        }

      }

      @media (max-width: 420px) {
        .topbar,
        main {
          width: min(100% - 1.25rem, 1180px);
        }

        .stat,
        .stat + .stat {
          padding-right: 0.6rem;
          padding-left: 0;
        }

        .stat:nth-child(even) {
          padding-left: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" aria-label="Zur Startseite">
        <img class="page-logo" src="assets/logos/SuperVerticale.svg" alt="Super Verticale" />
      </a>
      <a class="back-link" href="index.html">Back</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="event-title">
        <div>
          <p class="eyebrow">SUPER VERTICALE / Bleiburg, Carinthia, Austria</p>
          <h1 id="event-title">PETZEN 2027</h1>
        </div>
      </section>
      <section class="stats" aria-label="Event statistics">
        <div class="stat"><div class="stat-value">10.1 km</div><div class="stat-label">Distance</div></div>
        <div class="stat"><div class="stat-value">+1,074 m</div><div class="stat-label">Elevation gain</div></div>
        <div class="stat"><div class="stat-value">653 m</div><div class="stat-label">Start elevation</div></div>
        <div class="stat"><div class="stat-value">1,707 m</div><div class="stat-label">Finish elevation</div></div>
      </section>
      <section class="visuals" aria-label="Event route and elevation profile">
        <figure>
          <iframe class="interactive-route" src="assets/route/PetzensuperVerticale-interactive.html" title="Interactive GPS route and elevation profile of the Petzen Super Verticale"></iframe>
        </figure>
      </section>
    </main>

  </body>
</html>

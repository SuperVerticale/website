<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10231f" />
    <meta
      name="description"
      content="Up We Go - Ascent As The Event"
    />
    <title>Super Verticale</title>
    <link rel="icon" href="assets/logos/sv_mini.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'TT Chocolates';
        src: url('assets/fonts/tt-chocolates-regular.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --brown: #292017;
        --rust: #603834;
        --neon: #E0F131;
        --green: #937C66;
        --light-grey: #A99886;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        height: 100dvh;
        place-items: center;
        overflow: hidden;
        position: relative;
        background: var(--rust);
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        background: rgb(96 56 52 / 20%);
        content: '';
        pointer-events: none;
        z-index: 1;
      }

      .background-video {
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 6;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
      }

      .background-videos {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        gap: 0.35rem;
        padding: 0.35rem;
        background: var(--rust);
        pointer-events: none;
        z-index: 0;
        height: 100dvh;
      }

      @media (max-width: 600px) {
        .background-videos {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-rows: repeat(8, minmax(0, 1fr));
          gap: 0.2rem;
          padding: 0.2rem;
        }

        .background-video {
          object-fit: cover;
        }
      }

      main {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
        z-index: 2;
      }

      .palette-note {
        position: fixed;
        left: 1rem;
        bottom: 2.3rem;
        z-index: 3;
        max-width: min(92vw, 44rem);
        padding: 0.45rem 0.7rem;
        border: 1px solid rgb(147 124 102 / 70%);
        background: rgb(96 56 52 / 82%);
        color: var(--light-grey);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.5;
        text-transform: uppercase;
      }
      
      .credit {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 0.83rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-shadow: 0 0 12px rgb(41 32 23 / 50%);
      }

      .dashboard-link {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 0.83rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-shadow: 0 0 12px rgb(224 241 49 / 40%);
        transition: color 180ms ease, text-shadow 180ms ease;
        z-index: 3;
      }

      .events-link {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 3;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 0.83rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-shadow: 0 0 12px rgb(224 241 49 / 40%);
        transition: color 180ms ease, text-shadow 180ms ease;
      }

      .events-link:hover,
      .events-link:focus-visible {
        color: #f4ff8d;
        text-shadow: 0 0 14px rgb(224 241 49 / 70%);
      }

      .instagram-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 3;
        color: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 0.83rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-shadow: 0 0 12px rgb(224 241 49 / 40%);
        transition: color 180ms ease, text-shadow 180ms ease;
      }

      .instagram-link:hover,
      .instagram-link:focus-visible {
        color: #f4ff8d;
        text-shadow: 0 0 14px rgb(224 241 49 / 70%);
      }

      .dashboard-link:hover,
      .dashboard-link:focus-visible {
        color: #f4ff8d;
        text-shadow: 0 0 14px rgb(224 241 49 / 70%);
      }

      .logo {
        width: min(88vw, 40rem);
        height: auto;
        display: block;
        margin-top: -18vh;
        transform: translateY(-0.5rem);
      }

      .logo-mark {
        fill: none;
        stroke: var(--rust);
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-width: 3;
        filter: drop-shadow(0 0 8px rgb(96 56 52 / 45%));
      }

      .logo-type {
        fill: var(--neon);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 1px;
        filter: drop-shadow(0 0 10px rgb(224 241 49 / 35%));
      }

      .logo-subtitle {
        fill: var(--light-grey);
        font-family: 'TT Chocolates', Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 5px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .logo {
          animation: arrive 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
